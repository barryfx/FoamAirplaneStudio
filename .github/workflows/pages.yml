name: Publish project website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'resources/graphics/FoamAirplaneStudio.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static site
        run: |
          mkdir -p _site
          cp website/index.html website/style.css _site/
          cp resources/graphics/FoamAirplaneStudio.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
